# SPDX-License-Identifier: AGPL-3.0-only
#
# Linux port builds (Fase 1 POSIX runtime + Fase 2a/2b Qt6; DGX OS /
# Ubuntu 24.04, GCC 13, Ninja).
#
# Scope: portable core libraries + cuajone_cpu_tests + the POSIX runtime
# (cuajone_runtime, NexoAIVision CLI via the `linux-release` preset) and the
# runtime test binaries it enables: cuajone_evidence_tests,
# cuajone_capture_diagnostics_tests, cuajone_onnx_tests (exact target names).
# The Windows-only remainder (Win32 launcher, installer CA) stays skipped on
# UNIX by native/CMakeLists.txt. TensorRT/CUDA is opt-in only in the package
# job; the ordinary CPU jobs remain CPU-only. The Linux ONNX Runtime 1.25.0 package
# (onnxruntime-linux-x64) is provisioned below; see docs/LinuxPort.md.

name: Linux build (Fase 1 + Qt6)

on:
  push:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-fase1:
    name: POSIX runtime CLI + tests
    runs-on: ubuntu-24.04
    env:
      ONNXRUNTIME_ROOT: ${{ github.workspace }}/.tools/native/linux-onnxruntime-1.25.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            .tools/native/dependencies
            .tools/native/linux-onnxruntime-1.25.0
          key: native-linux-deps-${{ hashFiles('native/third_party/byte-track-eigen-cuajone.patch', 'installer/linux/dependency-lock.env') }}-ort1.25.0

      - name: Install toolchain and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            dpkg-dev libopencv-dev qt6-base-dev git patch unzip curl ca-certificates

      - name: Show toolchain versions
        run: |
          gcc --version | head -n 1
          cmake --version | head -n 1
          ninja --version
          pkg-config --modversion opencv4

      - name: Provision verified native dependencies
        run: bash installer/linux/provision-deps.sh --project-root "$GITHUB_WORKSPACE"

      - name: Configure (linux-release preset)
        working-directory: native
        run: cmake --preset linux-release

      - name: Build (linux-release preset)
        working-directory: native
        run: cmake --build --preset linux-release

      - name: Run native tests (CTest)
        working-directory: native
        run: ctest --preset linux-release --output-on-failure

  linux-qt:
    name: Qt6 launcher smoke build
    needs: linux-fase1
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .tools/native/dependencies
          key: native-linux-deps-${{ hashFiles('native/third_party/byte-track-eigen-cuajone.patch', 'installer/linux/dependency-lock.env') }}-ort1.25.0

      - name: Install Qt6 and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config dpkg-dev libopencv-dev qt6-base-dev git patch unzip curl ca-certificates

      - name: Provision verified native dependencies
        run: bash installer/linux/provision-deps.sh --project-root "$GITHUB_WORKSPACE"

      - name: Configure Qt6 launcher
        run: |
          cmake -S native -B .tools/native/build/presets/linux-qt \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCUAJONE_BUILD_RUNTIME=OFF \
            -DCUAJONE_BUILD_TESTS=OFF \
            -DCUAJONE_BUILD_LAUNCHER=OFF \
            -DCUAJONE_BUILD_QT_LAUNCHER=ON

      - name: Build exact Qt6 launcher target
        run: cmake --build .tools/native/build/presets/linux-qt --target cuajone_qt_launcher

      - name: Qt6 launcher help smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/native/build/presets/linux-qt/NexoAIVisionLauncher --help

  linux-qt-viewer:
    name: Qt6 live analytics viewer build
    needs: linux-fase1
    runs-on: ubuntu-24.04
    env:
      ONNXRUNTIME_ROOT: ${{ github.workspace }}/.tools/native/linux-onnxruntime-1.25.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            .tools/native/dependencies
            .tools/native/linux-onnxruntime-1.25.0
          key: native-linux-deps-${{ hashFiles('native/third_party/byte-track-eigen-cuajone.patch', 'installer/linux/dependency-lock.env') }}-ort1.25.0

      - name: Install Qt6 and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config dpkg-dev libopencv-dev qt6-base-dev git patch unzip curl ca-certificates

      - name: Provision verified native dependencies
        run: bash installer/linux/provision-deps.sh --project-root "$GITHUB_WORKSPACE"

      - name: Configure Qt6 live viewer
        run: |
          cmake -S native -B .tools/native/build/presets/linux-qt-viewer \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCUAJONE_BUILD_RUNTIME=ON \
            -DCUAJONE_BUILD_TESTS=OFF \
            -DCUAJONE_BUILD_LAUNCHER=OFF \
            -DCUAJONE_BUILD_QT_VIEWER=ON \
            -DONNXRUNTIME_ROOT="$ONNXRUNTIME_ROOT"

      - name: Build exact Qt6 viewer runtime target
        run: cmake --build .tools/native/build/presets/linux-qt-viewer --target cuajone_native

      - name: Qt6 viewer help smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: .tools/native/build/presets/linux-qt-viewer/NexoAIVision --help

  linux-package:
    name: Linux DEB and tarball package
    runs-on: ubuntu-24.04
    env:
      ONNXRUNTIME_ROOT: ${{ github.workspace }}/.tools/native/linux-onnxruntime-1.25.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            .tools/native/dependencies
            .tools/native/linux-onnxruntime-1.25.0
          key: native-linux-deps-${{ hashFiles('native/third_party/byte-track-eigen-cuajone.patch', 'installer/linux/dependency-lock.env') }}-ort1.25.0

      - name: Install packaging toolchain and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config dpkg-dev \
            libopencv-dev qt6-base-dev git patch unzip curl ca-certificates

      - name: Provision verified native dependencies
        run: bash installer/linux/provision-deps.sh --project-root "$GITHUB_WORKSPACE"

      - name: Build DEB and tarball
        run: |
          chmod +x installer/linux/build-dist.sh installer/linux/run.sh installer/linux/postinst
          installer/linux/build-dist.sh \
            --build-dir .tools/native/build/linux-package \
            --output-dir .tools/native/dist \
            --version 0.1.0 \
            --with-qt

      - name: Verify package outputs
        run: |
          test -f .tools/native/dist/nexoai-vision-0.1.0-linux-x86_64.deb
          test -f .tools/native/dist/nexoai-vision-0.1.0-linux-x86_64.tar.gz
          tar -tzf .tools/native/dist/nexoai-vision-0.1.0-linux-x86_64.tar.gz | grep -E '(^|/)run\.sh$'

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: nexoai-vision-linux-0.1.0
          path: .tools/native/dist/*
          if-no-files-found: error
